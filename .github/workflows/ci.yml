name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      - name: ruff
        run: ruff check .
      - name: isort
        run: isort --check .
      - name: black
        run: black --check .
      - name: mypy
        run: mypy --strict src/holotrauma3x
      - name: pytest
        run: pytest -q
